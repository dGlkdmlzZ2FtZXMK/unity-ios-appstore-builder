name: Reusable Unity iOS App Store build

on:
  workflow_call:
    inputs:
      app:
        description: Short app key
        required: true
        type: string
      app_display_name:
        description: Human-readable app name
        required: true
        type: string
      expected_bundle_id:
        description: Expected application bundle identifier
        required: true
        type: string
      xcode_scheme:
        description: Xcode scheme
        required: true
        type: string
      unity_version:
        description: Exact Unity editor version used for the export
        required: true
        type: string
      xcode_version:
        description: Xcode version installed on the runner
        required: true
        type: string
      asset_name:
        description: Exact ZIP asset name on the ios-inputs release
        required: true
        type: string
      sha256:
        description: ZIP SHA-256
        required: true
        type: string
      content_sha256:
        description: Stable source-content SHA-256
        required: true
        type: string
      native_source_sha256:
        description: Stable generated IL2CPP-source SHA-256
        required: true
        type: string
      request_id:
        description: Unique publisher request ID
        required: true
        type: string
      upload_to_app_store:
        description: Upload the exported IPA to App Store Connect
        required: true
        type: boolean
      keep_ipa_artifact:
        description: Retain a successful IPA as a three-day Actions artifact
        required: true
        type: boolean
      use_build_cache:
        description: Restore and save CocoaPods and Unity Bee caches
        required: true
        type: boolean
    secrets:
      APPLE_TEAM_ID:
        required: true
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY_BASE64:
        required: true
      IOS_DEVELOPMENT_P12_BASE64:
        required: true
      IOS_DEVELOPMENT_P12_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build ${{ inputs.app }}
    runs-on: macos-26
    timeout-minutes: 45

    env:
      BUILDER_CORE_VERSION: "2.3.0"
      RELEASE_TAG: ios-inputs

      APP_KEY: ${{ inputs.app }}
      APP_DISPLAY_NAME: ${{ inputs.app_display_name }}
      EXPECTED_BUNDLE_ID: ${{ inputs.expected_bundle_id }}
      XCODE_SCHEME: ${{ inputs.xcode_scheme }}
      UNITY_VERSION: ${{ inputs.unity_version }}
      XCODE_VERSION: ${{ inputs.xcode_version }}

      INPUT_ASSET_NAME: ${{ inputs.asset_name }}
      INPUT_SHA256: ${{ inputs.sha256 }}
      INPUT_CONTENT_SHA256: ${{ inputs.content_sha256 }}
      INPUT_NATIVE_SOURCE_SHA256: ${{ inputs.native_source_sha256 }}
      REQUEST_ID: ${{ inputs.request_id }}

      UPLOAD_TO_APP_STORE: ${{ inputs.upload_to_app_store }}
      KEEP_IPA_ARTIFACT: ${{ inputs.keep_ipa_artifact }}
      USE_BUILD_CACHE: ${{ inputs.use_build_cache }}

      COCOAPODS_DISABLE_STATS: "true"

    steps:
      - name: Validate build request
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DEVELOPMENT_P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          IOS_DEVELOPMENT_P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "Tidvis Unity iOS App Store Builder"
          echo "=========================================="
          echo "Core version:  $BUILDER_CORE_VERSION"
          echo "Caller repo:   $GITHUB_REPOSITORY"
          echo "App:           $APP_DISPLAY_NAME ($APP_KEY)"
          echo "Bundle ID:     $EXPECTED_BUNDLE_ID"
          echo "Unity:         $UNITY_VERSION"
          echo "Xcode:         $XCODE_VERSION"
          echo "Scheme:        $XCODE_SCHEME"
          echo "Request:       $REQUEST_ID"
          echo "Input:         $INPUT_ASSET_NAME"
          echo "Upload:        $UPLOAD_TO_APP_STORE"
          echo "Keep IPA:      $KEEP_IPA_ARTIFACT"
          echo "Use caches:    $USE_BUILD_CACHE"
          echo ""

          echo "BUILDER_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

          failed=0

          require_value() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::$name is not configured."
              failed=1
            else
              echo "[OK] $name"
            fi
          }

          require_value "APP_KEY" "$APP_KEY"
          require_value "APP_DISPLAY_NAME" "$APP_DISPLAY_NAME"
          require_value "EXPECTED_BUNDLE_ID" "$EXPECTED_BUNDLE_ID"
          require_value "XCODE_SCHEME" "$XCODE_SCHEME"
          require_value "UNITY_VERSION" "$UNITY_VERSION"
          require_value "XCODE_VERSION" "$XCODE_VERSION"
          require_value "INPUT_ASSET_NAME" "$INPUT_ASSET_NAME"
          require_value "INPUT_SHA256" "$INPUT_SHA256"
          require_value "INPUT_CONTENT_SHA256" "$INPUT_CONTENT_SHA256"
          require_value "INPUT_NATIVE_SOURCE_SHA256" "$INPUT_NATIVE_SOURCE_SHA256"
          require_value "REQUEST_ID" "$REQUEST_ID"
          require_value "APPLE_TEAM_ID" "$APPLE_TEAM_ID"
          require_value "ASC_KEY_ID" "$ASC_KEY_ID"
          require_value "ASC_ISSUER_ID" "$ASC_ISSUER_ID"
          require_value "ASC_PRIVATE_KEY_BASE64" "$ASC_PRIVATE_KEY_BASE64"
          require_value "IOS_DEVELOPMENT_P12_BASE64" "$IOS_DEVELOPMENT_P12_BASE64"
          require_value "IOS_DEVELOPMENT_P12_PASSWORD" "$IOS_DEVELOPMENT_P12_PASSWORD"

          [[ "$APP_KEY" =~ ^[A-Za-z0-9_-]{2,40}$ ]] || {
            echo "::error::Invalid app key."
            failed=1
          }

          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{4,64}$ ]] || {
            echo "::error::Invalid request ID."
            failed=1
          }

          [[ "$EXPECTED_BUNDLE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{2,254}$ ]] || {
            echo "::error::Invalid expected bundle identifier."
            failed=1
          }

          [[ "$INPUT_ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,180}\.zip$ ]] || {
            echo "::error::Invalid package filename."
            failed=1
          }

          for hash_value in \
            "$INPUT_SHA256" \
            "$INPUT_CONTENT_SHA256" \
            "$INPUT_NATIVE_SOURCE_SHA256"; do
            [[ "$hash_value" =~ ^[A-Fa-f0-9]{64}$ ]] || {
              echo "::error::One or more SHA-256 inputs are invalid."
              failed=1
              break
            }
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Build-request validation failed."
            exit 1
          fi

          echo ""
          echo "[OK] Build request is valid."

      - name: Select Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          xcode_path="/Applications/Xcode_${XCODE_VERSION}.app"

          if [[ ! -d "$xcode_path" ]]; then
            echo "::error::Xcode $XCODE_VERSION was not found at $xcode_path."
            echo "Available Xcode installations:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "$xcode_path/Contents/Developer"

          {
            echo "XCODE_PATH=$xcode_path"
            echo "BEE_CACHE_DIRECTORY=$HOME/Library/Unity/cache/bee"
          } >> "$GITHUB_ENV"

          echo "Xcode:"
          xcodebuild -version
          echo ""
          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version
          echo ""
          echo "Host architecture: $(uname -m)"

      - name: Prepare diagnostic directories
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs" "$GITHUB_WORKSPACE/export"
          echo "Diagnostic directory: $GITHUB_WORKSPACE/logs"

      - name: Validate Apple credentials
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DEVELOPMENT_P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          IOS_DEVELOPMENT_P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail

          started_at="$(date +%s)"

          key_dir="$RUNNER_TEMP/appstore-key"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          altool_key_dir="$HOME/.appstoreconnect/private_keys"

          certificate_path="$RUNNER_TEMP/ios-development.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)-$(uuidgen)"

          mkdir -p "$key_dir" "$altool_key_dir"

          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 -D > "$key_path"

          if [[ ! -s "$key_path" ]]; then
            echo "::error::App Store Connect private key could not be restored."
            exit 1
          fi

          chmod 600 "$key_path"

          if ! openssl pkey \
            -in "$key_path" \
            -check \
            -noout \
            > "$GITHUB_WORKSPACE/logs/asc-key-check.log" 2>&1; then
            echo "::error::ASC_PRIVATE_KEY_BASE64 is not a valid PEM private key."
            cat "$GITHUB_WORKSPACE/logs/asc-key-check.log" || true
            exit 1
          fi

          cp "$key_path" "$altool_key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$altool_key_dir/AuthKey_${ASC_KEY_ID}.p8"

          printf '%s' "$IOS_DEVELOPMENT_P12_BASE64" | base64 -D > "$certificate_path"

          if [[ ! -s "$certificate_path" ]]; then
            echo "::error::Persistent Apple Development P12 could not be restored."
            exit 1
          fi

          chmod 600 "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"

          if ! security import "$certificate_path" \
            -P "$IOS_DEVELOPMENT_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path" \
            > "$GITHUB_WORKSPACE/logs/p12-import.log" 2>&1; then
            echo "::error::The Apple Development P12 could not be imported."
            echo "::error::Verify IOS_DEVELOPMENT_P12_BASE64 and IOS_DEVELOPMENT_P12_PASSWORD."
            cat "$GITHUB_WORKSPACE/logs/p12-import.log" || true
            exit 1
          fi

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path" \
            > "$GITHUB_WORKSPACE/logs/keychain-partition.log" 2>&1

          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          echo "$identity_output"

          if ! grep -Fq "Apple Development" <<< "$identity_output"; then
            echo "::error::The P12 does not contain a usable Apple Development identity and private key."
            exit 1
          fi

          export API_PRIVATE_KEYS_DIR="$key_dir"

          if ! xcrun altool \
            --list-providers \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            > "$GITHUB_WORKSPACE/logs/asc-auth-probe.log" 2>&1; then
            echo "::error::App Store Connect authentication failed."
            echo "::error::Verify ASC_KEY_ID, ASC_ISSUER_ID, and ASC_PRIVATE_KEY_BASE64."
            tail -80 "$GITHUB_WORKSPACE/logs/asc-auth-probe.log" || true
            exit 1
          fi

          ended_at="$(date +%s)"
          duration="$((ended_at - started_at))"

          {
            echo "ASC_KEY_PATH=$key_path"
            echo "API_PRIVATE_KEYS_DIR=$key_dir"
            echo "SIGNING_KEYCHAIN_PATH=$keychain_path"
            echo "CREDENTIAL_SECONDS=$duration"
          } >> "$GITHUB_ENV"

          echo "[OK] Apple credentials validated in ${duration}s."

      - name: Download exact Unity iOS package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          started_at="$(date +%s)"
          input_dir="$RUNNER_TEMP/input"
          mkdir -p "$input_dir"

          echo "Downloading release asset:"
          echo "  Repository: $GITHUB_REPOSITORY"
          echo "  Release:    $RELEASE_TAG"
          echo "  Asset:      $INPUT_ASSET_NAME"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$INPUT_ASSET_NAME" \
            --dir "$input_dir"

          zip_path="$input_dir/$INPUT_ASSET_NAME"

          if [[ ! -f "$zip_path" ]]; then
            echo "::error::Requested package was not downloaded."
            exit 1
          fi

          ended_at="$(date +%s)"
          duration="$((ended_at - started_at))"

          {
            echo "ZIP_PATH=$zip_path"
            echo "PACKAGE_DOWNLOAD_SECONDS=$duration"
          } >> "$GITHUB_ENV"

          ls -lh "$zip_path"
          echo "[OK] Package downloaded in ${duration}s."

      - name: Verify package SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail

          expected="$(printf '%s' "$INPUT_SHA256" | tr '[:upper:]' '[:lower:]')"
          actual="$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"

          echo "Expected: $expected"
          echo "Actual:   $actual"

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::SHA-256 mismatch. The release asset is not the dispatched package."
            exit 1
          fi

          echo "[OK] Package checksum verified."

      - name: Validate ZIP structure
        shell: bash
        run: |
          set -Eeuo pipefail
          export ZIP_PATH

          python3 <<'PY'
          import os
          import sys
          import zipfile
          from pathlib import PurePosixPath

          zip_path = os.environ["ZIP_PATH"]

          try:
              archive = zipfile.ZipFile(zip_path)
          except zipfile.BadZipFile:
              print("::error::Input file is not a valid ZIP archive.")
              sys.exit(1)

          entries = archive.infolist()
          if not entries:
              print("::error::ZIP archive is empty.")
              sys.exit(1)

          for entry in entries:
              name = entry.filename.replace("\\", "/")
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts:
                  print(f"::error::Unsafe ZIP path detected: {name}")
                  sys.exit(1)

          print(f"[OK] ZIP structure validated ({len(entries)} entries).")
          PY

      - name: Extract Unity Xcode project
        shell: bash
        run: |
          set -Eeuo pipefail

          ios_project="$GITHUB_WORKSPACE/ios-project"
          mkdir -p "$ios_project"

          ditto -x -k "$ZIP_PATH" "$ios_project"

          {
            echo "IOS_PROJECT=$ios_project"
            echo "MANIFEST_PATH=$ios_project/tidvis-build.json"
          } >> "$GITHUB_ENV"

          if [[ ! -d "$ios_project/Unity-iPhone.xcodeproj" ]]; then
            echo "::error::Unity-iPhone.xcodeproj was not found at the ZIP root."
            echo "Extracted structure:"
            find "$ios_project" -maxdepth 3 -print | head -200
            exit 1
          fi

          if [[ ! -f "$ios_project/tidvis-build.json" ]]; then
            echo "::error::tidvis-build.json is missing from the package root."
            exit 1
          fi

          echo "Extracted root:"
          ls -lah "$ios_project"
          echo "[OK] Unity Xcode project found."

      - name: Verify package manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          export \
            APP_KEY \
            APP_DISPLAY_NAME \
            EXPECTED_BUNDLE_ID \
            XCODE_SCHEME \
            UNITY_VERSION \
            INPUT_CONTENT_SHA256 \
            INPUT_NATIVE_SOURCE_SHA256 \
            REQUEST_ID \
            MANIFEST_PATH

          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          manifest_path = Path(os.environ["MANIFEST_PATH"])

          try:
              data = json.loads(manifest_path.read_text(encoding="utf-8-sig"))
          except Exception as exc:
              print(f"::error::Could not parse tidvis-build.json: {exc}")
              sys.exit(1)

          expected = {
              "app": os.environ["APP_KEY"],
              "appDisplayName": os.environ["APP_DISPLAY_NAME"],
              "bundleId": os.environ["EXPECTED_BUNDLE_ID"],
              "scheme": os.environ["XCODE_SCHEME"],
              "unityVersion": os.environ["UNITY_VERSION"],
              "contentSha256": os.environ["INPUT_CONTENT_SHA256"].lower(),
              "nativeSourceSha256": os.environ["INPUT_NATIVE_SOURCE_SHA256"].lower(),
              "requestId": os.environ["REQUEST_ID"],
          }

          errors = []

          for key, value in expected.items():
              actual = data.get(key)
              if key in {"contentSha256", "nativeSourceSha256"} and isinstance(actual, str):
                  actual = actual.lower()
              if actual != value:
                  errors.append(f"{key}: expected {value!r}, received {actual!r}")

          if data.get("schemaVersion") != 2:
              errors.append(
                  f"schemaVersion: expected 2, received {data.get('schemaVersion')!r}"
              )

          native_file_count = data.get("nativeSourceFileCount")
          if not isinstance(native_file_count, int) or native_file_count < 1:
              errors.append(
                  "nativeSourceFileCount must be a positive integer; "
                  f"received {native_file_count!r}"
              )

          if errors:
              print("::error::Package manifest validation failed:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          print("Manifest:")
          for key in (
              "publisherVersion",
              "app",
              "bundleId",
              "unityVersion",
              "marketingVersion",
              "buildNumber",
              "sourceFileCount",
              "sourceBytes",
              "contentSha256",
              "nativeSourceFileCount",
              "nativeSourceSha256",
          ):
              print(f"  {key}: {data.get(key)}")

          print("[OK] Package manifest verified.")
          PY

      - name: Normalize future timestamps
        shell: bash
        run: |
          set -Eeuo pipefail
          export IOS_PROJECT

          python3 <<'PY'
          import os
          import time
          from pathlib import Path

          root = Path(os.environ["IOS_PROJECT"])
          now = time.time()
          future_limit = now + 60
          safe_time = now - 120
          changed = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  stat = path.stat()
              except OSError:
                  continue
              if stat.st_mtime > future_limit:
                  os.utime(path, (min(stat.st_atime, safe_time), safe_time))
                  changed.append(str(path.relative_to(root)))

          print(f"Future timestamps corrected: {len(changed)}")
          for item in changed[:25]:
              print(f"  - {item}")
          if len(changed) > 25:
              print(f"  ... and {len(changed) - 25} more")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"FUTURE_TIMESTAMP_COUNT={len(changed)}\n")
          PY

      - name: Restore Unix executable permissions
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          script_count="$(find . -type f -name '*.sh' | wc -l | tr -d ' ')"

          if [[ "$script_count" -gt 0 ]]; then
            find . -type f -name '*.sh' -exec chmod +x {} +
          fi

          chmod +x usymtool usymtoolarm64 2>/dev/null || true
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_arm64/il2cpp 2>/dev/null || true
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_arm64/bee_backend/mac-arm64/bee_backend 2>/dev/null || true

          echo "[OK] Restored executable permissions for $script_count shell scripts."

      - name: Prepare CocoaPods cache
        id: pods-key
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "Podfile" ]]; then
            echo "has_podfile=false" >> "$GITHUB_OUTPUT"
            echo "No Podfile found. CocoaPods is not required."
            exit 0
          fi

          echo "has_podfile=true" >> "$GITHUB_OUTPUT"

          if [[ -d "Pods" || -d "Unity-iPhone.xcworkspace" ]]; then
            echo "Removing packaged CocoaPods output before cache restore."
            rm -rf "Pods" "Unity-iPhone.xcworkspace"
          fi

          pod_version="$(pod --version | tr -cd 'A-Za-z0-9._-')"
          podfile_hash="$(shasum -a 256 Podfile | awk '{print $1}')"

          if [[ -f "Podfile.lock" ]]; then
            packaged_lock_hash="$(shasum -a 256 Podfile.lock | awk '{print $1}')"
            input_hash="$(printf '%s:%s' "$podfile_hash" "$packaged_lock_hash" | shasum -a 256 | awk '{print $1}')"
          else
            input_hash="$podfile_hash"
          fi

          primary_key="pods-v4a-${RUNNER_OS}-${RUNNER_ARCH}-${APP_KEY}-xcode${XCODE_VERSION}-cocoapods${pod_version}-input-${input_hash}"
          legacy_prefix="pods-v3-${RUNNER_OS}-${RUNNER_ARCH}-${APP_KEY}-xcode${XCODE_VERSION}-cocoapods${pod_version}-"

          {
            echo "pod_version=$pod_version"
            echo "podfile_hash=$podfile_hash"
            echo "primary_key=$primary_key"
            echo "legacy_prefix=$legacy_prefix"
          } >> "$GITHUB_OUTPUT"

          {
            echo "PODS_PRIMARY_KEY=$primary_key"
            echo "PODS_PODFILE_HASH=$podfile_hash"
          } >> "$GITHUB_ENV"

          echo "CocoaPods state key: $primary_key"

      - name: Restore CocoaPods resolved state
        id: pods-v4-restore
        if: ${{ inputs.use_build_cache && steps.pods-key.outputs.has_podfile == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos/trunk
            ios-project/Pods
            ios-project/Podfile.lock
            ios-project/.tidvis-pods-podfile.sha256
          key: ${{ steps.pods-key.outputs.primary_key }}

      - name: Restore legacy CocoaPods cache for migration
        id: pods-v3-restore
        if: ${{ inputs.use_build_cache && steps.pods-key.outputs.has_podfile == 'true' && steps.pods-v4-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios-project/Pods
          key: pods-v3-migration-${{ github.run_id }}
          restore-keys: |
            ${{ steps.pods-key.outputs.legacy_prefix }}

      - name: Validate restored CocoaPods state
        id: pods-state
        if: ${{ steps.pods-key.outputs.has_podfile == 'true' }}
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          exact_hit="${{ steps.pods-v4-restore.outputs.cache-hit }}"
          legacy_key="${{ steps.pods-v3-restore.outputs.cache-matched-key }}"
          lock_restored=false
          migrated_legacy=false

          if [[ "$exact_hit" == "true" ]]; then
            complete=true

            [[ -f "Podfile.lock" ]] || complete=false
            [[ -f "Pods/Manifest.lock" ]] || complete=false
            [[ -d "Pods/Pods.xcodeproj" ]] || complete=false
            [[ -f ".tidvis-pods-podfile.sha256" ]] || complete=false

            if [[ "$complete" == "true" ]] &&
               cmp -s "Podfile.lock" "Pods/Manifest.lock" &&
               [[ "$(cat .tidvis-pods-podfile.sha256)" == "$PODS_PODFILE_HASH" ]]; then
              lock_restored=true
              echo "[OK] Complete CocoaPods dependency state restored."
              echo "A fast deterministic pod install will integrate the fresh Unity Xcode project."
            else
              echo "::warning::The exact CocoaPods cache was incomplete. Rebuilding CocoaPods state."
              rm -rf Pods Unity-iPhone.xcworkspace Podfile.lock .tidvis-pods-podfile.sha256
            fi
          elif [[ -n "$legacy_key" && -f "Pods/Manifest.lock" ]]; then
            cp "Pods/Manifest.lock" "Podfile.lock"
            lock_restored=true
            migrated_legacy=true
            echo "[OK] Migrated Podfile.lock from the existing v3 cache."
          fi

          {
            echo "lock_restored=$lock_restored"
            echo "migrated_legacy=$migrated_legacy"
          } >> "$GITHUB_OUTPUT"

          {
            echo "PODS_CACHE_EXACT=$exact_hit"
            echo "PODS_CACHE_MATCHED_KEY=${{ steps.pods-v4-restore.outputs.cache-matched-key }}"
            echo "PODS_LEGACY_MATCHED_KEY=$legacy_key"
            echo "PODS_LOCK_RESTORED=$lock_restored"
            echo "PODS_LEGACY_MIGRATED=$migrated_legacy"
          } >> "$GITHUB_ENV"

      - name: Install CocoaPods dependencies
        if: ${{ steps.pods-key.outputs.has_podfile == 'true' }}
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          started_at="$(date +%s)"

          echo "CocoaPods version: $(pod --version)"
          echo "Exact v4 cache hit: ${{ steps.pods-v4-restore.outputs.cache-hit }}"
          echo "Legacy cache key:   ${{ steps.pods-v3-restore.outputs.cache-matched-key }}"

          if pod repo list 2>/dev/null | grep -Eq '^cocoapods[[:space:]]'; then
            echo "Removing duplicate legacy CocoaPods specs repository."
            pod repo remove cocoapods || true
          fi

          install_with_repo_update=false

          rm -rf "Unity-iPhone.xcworkspace"

          if [[ -f "Podfile.lock" ]]; then
            echo "Running deterministic CocoaPods integration from Podfile.lock."

            if ! pod install --deployment --no-repo-update; then
              echo "::warning::The restored/generated Podfile.lock could not be used."
              echo "::warning::Resolving dependencies again from Podfile."
              rm -f Podfile.lock
              install_with_repo_update=true
            fi
          else
            install_with_repo_update=true
          fi

          if [[ "$install_with_repo_update" == "true" ]]; then
            if ! pod install --no-repo-update; then
              echo "::warning::CocoaPods could not resolve with local specs. Retrying with repository update."
              pod install --repo-update
            fi
          fi

          ended_at="$(date +%s)"
          duration="$((ended_at - started_at))"

          echo "PODS_INSTALL_SECONDS=$duration" >> "$GITHUB_ENV"
          echo "[OK] CocoaPods dependencies installed in ${duration}s."

      - name: Verify CocoaPods resolved state
        id: pods-verify
        if: ${{ steps.pods-key.outputs.has_podfile == 'true' }}
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "Podfile.lock" || {
            echo "::error::CocoaPods did not produce Podfile.lock."
            exit 1
          }

          test -f "Pods/Manifest.lock" || {
            echo "::error::CocoaPods did not produce Pods/Manifest.lock."
            exit 1
          }

          test -d "Pods/Pods.xcodeproj" || {
            echo "::error::CocoaPods did not produce Pods/Pods.xcodeproj."
            exit 1
          }

          test -d "Unity-iPhone.xcworkspace" || {
            echo "::error::CocoaPods did not produce Unity-iPhone.xcworkspace."
            exit 1
          }

          if ! cmp -s "Podfile.lock" "Pods/Manifest.lock"; then
            echo "::error::Podfile.lock and Pods/Manifest.lock do not match."
            exit 1
          fi

          printf '%s' "$PODS_PODFILE_HASH" > ".tidvis-pods-podfile.sha256"

          echo "state_valid=true" >> "$GITHUB_OUTPUT"
          echo "[OK] CocoaPods state is complete and cacheable."

      - name: Save CocoaPods resolved state
        if: ${{ inputs.use_build_cache && steps.pods-key.outputs.has_podfile == 'true' && steps.pods-verify.outputs.state_valid == 'true' && steps.pods-v4-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos/trunk
            ios-project/Pods
            ios-project/Podfile.lock
            ios-project/.tidvis-pods-podfile.sha256
          key: ${{ steps.pods-key.outputs.primary_key }}

      - name: Determine Xcode build container
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -d "Unity-iPhone.xcworkspace" ]]; then
            {
              echo "XCODE_CONTAINER_TYPE=workspace"
              echo "XCODE_CONTAINER=Unity-iPhone.xcworkspace"
            } >> "$GITHUB_ENV"
            echo "Using Unity-iPhone.xcworkspace"
          else
            {
              echo "XCODE_CONTAINER_TYPE=project"
              echo "XCODE_CONTAINER=Unity-iPhone.xcodeproj"
            } >> "$GITHUB_ENV"
            echo "Using Unity-iPhone.xcodeproj"
          fi

      - name: Verify Xcode scheme
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          scheme_json="$GITHUB_WORKSPACE/logs/xcode-schemes.json"

          if [[ "$XCODE_CONTAINER_TYPE" == "workspace" ]]; then
            xcodebuild -workspace "$XCODE_CONTAINER" -list -json > "$scheme_json"
          else
            xcodebuild -project "$XCODE_CONTAINER" -list -json > "$scheme_json"
          fi

          export scheme_json XCODE_SCHEME

          python3 <<'PY'
          import json
          import os
          import sys

          with open(os.environ["scheme_json"], "r", encoding="utf-8") as handle:
              data = json.load(handle)

          container = data.get("workspace") or data.get("project") or {}
          schemes = container.get("schemes", [])
          expected = os.environ["XCODE_SCHEME"]

          print("Available schemes:")
          for scheme in schemes:
              print(f"  - {scheme}")

          if expected not in schemes:
              print(f"::error::Configured Xcode scheme {expected!r} was not found.")
              sys.exit(1)

          print(f"[OK] Scheme verified: {expected}")
          PY

      - name: Verify app identity
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          settings_file="$GITHUB_WORKSPACE/logs/app-build-settings.txt"

          if [[ "$XCODE_CONTAINER_TYPE" == "workspace" ]]; then
            xcodebuild \
              -workspace "$XCODE_CONTAINER" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -showBuildSettings > "$settings_file"
          else
            xcodebuild \
              -project "$XCODE_CONTAINER" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -showBuildSettings > "$settings_file"
          fi

          bundle_ids="$(
            awk -F ' = ' '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = / {print $2}' "$settings_file" |
              sort -u
          )"

          if [[ -z "$bundle_ids" ]]; then
            echo "::error::No PRODUCT_BUNDLE_IDENTIFIER could be determined."
            exit 1
          fi

          echo "Bundle identifiers found:"
          printf '%s\n' "$bundle_ids" | sed 's/^/  /'

          if ! grep -Fqx "$EXPECTED_BUNDLE_ID" <<< "$bundle_ids"; then
            echo "::error::Bundle identifier mismatch. Expected $EXPECTED_BUNDLE_ID."
            exit 1
          fi

          echo "[OK] App identity verified."

      - name: Preflight local Apple frameworks and entitlements
        working-directory: ios-project
        shell: bash
        run: |
          set -Eeuo pipefail

          framework_settings="$GITHUB_WORKSPACE/logs/unityframework-build-settings.txt"
          needs_apple_core=0
          needs_gamekit=0

          if [[ -d "ApplePluginLibraries/Apple.Core/AppleCoreNative.framework" ]]; then
            needs_apple_core=1
            test -f "ApplePluginLibraries/Apple.Core/AppleCoreNative.framework/AppleCoreNative" || {
              echo "::error::AppleCoreNative.framework exists but its binary is missing."
              exit 1
            }
          fi

          if [[ -d "ApplePluginLibraries/Apple.GameKit/GameKitWrapper.framework" ]]; then
            needs_gamekit=1
            test -f "ApplePluginLibraries/Apple.GameKit/GameKitWrapper.framework/GameKitWrapper" || {
              echo "::error::GameKitWrapper.framework exists but its binary is missing."
              exit 1
            }
          fi

          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -target UnityFramework \
            -configuration Release \
            -showBuildSettings > "$framework_settings"

          if [[ "$needs_apple_core" -eq 1 ]]; then
            if ! grep -Fq "ApplePluginLibraries/Apple.Core" "$framework_settings"; then
              echo "::error::UnityFramework cannot resolve AppleCoreNative.framework."
              echo "::error::FRAMEWORK_SEARCH_PATHS is missing ApplePluginLibraries/Apple.Core."
              exit 1
            fi
            echo "[OK] UnityFramework can resolve AppleCoreNative.framework."
          fi

          if [[ "$needs_gamekit" -eq 1 ]]; then
            if ! grep -Fq "ApplePluginLibraries/Apple.GameKit" "$framework_settings"; then
              echo "::error::UnityFramework cannot resolve GameKitWrapper.framework."
              echo "::error::FRAMEWORK_SEARCH_PATHS is missing ApplePluginLibraries/Apple.GameKit."
              exit 1
            fi

            game_center_entitlement="$(
              grep -RIl \
                --include='*.entitlements' \
                'com.apple.developer.game-center' \
                . |
                head -1 || true
            )"

            if [[ -z "$game_center_entitlement" ]]; then
              echo "::error::GameKitWrapper is present, but no entitlements file declares com.apple.developer.game-center."
              exit 1
            fi

            echo "[OK] UnityFramework can resolve GameKitWrapper.framework."
            echo "[OK] Game Center entitlement found: $game_center_entitlement"
          fi

          echo "Local framework architectures:"
          [[ "$needs_apple_core" -eq 1 ]] &&
            lipo -info "ApplePluginLibraries/Apple.Core/AppleCoreNative.framework/AppleCoreNative" || true
          [[ "$needs_gamekit" -eq 1 ]] &&
            lipo -info "ApplePluginLibraries/Apple.GameKit/GameKitWrapper.framework/GameKitWrapper" || true

      - name: Prepare Unity Bee cache directory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$BEE_CACHE_DIRECTORY"
          echo "Unity Bee cache directory: $BEE_CACHE_DIRECTORY"

      - name: Restore Unity Bee object cache
        id: bee-cache-restore
        if: ${{ inputs.use_build_cache }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/Library/Unity/cache/bee
          key: bee-v4a-${{ runner.os }}-${{ runner.arch }}-${{ inputs.app }}-unity${{ inputs.unity_version }}-xcode${{ inputs.xcode_version }}-${{ inputs.native_source_sha256 }}
          restore-keys: |
            bee-v4a-${{ runner.os }}-${{ runner.arch }}-${{ inputs.app }}-unity${{ inputs.unity_version }}-xcode${{ inputs.xcode_version }}-

      - name: Report restored caches
        shell: bash
        run: |
          set -Eeuo pipefail

          bee_size_bytes=0
          if [[ -d "$BEE_CACHE_DIRECTORY" ]]; then
            bee_size_kib="$(du -sk "$BEE_CACHE_DIRECTORY" | awk '{print $1}')"
            bee_size_bytes="$((bee_size_kib * 1024))"
          fi

          {
            echo "BEE_CACHE_EXACT=${{ steps.bee-cache-restore.outputs.cache-hit }}"
            echo "BEE_CACHE_MATCHED_KEY=${{ steps.bee-cache-restore.outputs.cache-matched-key }}"
            echo "BEE_CACHE_BYTES_BEFORE=$bee_size_bytes"
          } >> "$GITHUB_ENV"

          echo "Build caches enabled: $USE_BUILD_CACHE"
          echo "CocoaPods exact hit:  ${PODS_CACHE_EXACT:-false}"
          echo "CocoaPods lock restored: ${PODS_LOCK_RESTORED:-false}"
          echo "CocoaPods install seconds: ${PODS_INSTALL_SECONDS:-0}"
          echo "Bee exact hit:        ${{ steps.bee-cache-restore.outputs.cache-hit }}"
          echo "Bee matched key:      ${{ steps.bee-cache-restore.outputs.cache-matched-key }}"
          echo "Bee cache before:     $bee_size_bytes bytes"

          if [[ "$bee_size_bytes" -gt 0 ]]; then
            du -sh "$BEE_CACHE_DIRECTORY"
          fi

      - name: Archive iOS app
        working-directory: ios-project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          archive_path="$RUNNER_TEMP/AppStore-${REQUEST_ID}.xcarchive"
          result_bundle="$GITHUB_WORKSPACE/logs/archive.xcresult"
          archive_log="$GITHUB_WORKSPACE/logs/archive.log"
          started_at="$(date +%s)"

          rm -rf "$result_bundle"
          mkdir -p "$BEE_CACHE_DIRECTORY"

          echo "=========================================="
          echo "Archiving $APP_DISPLAY_NAME"
          echo "=========================================="
          echo "Bundle:     $EXPECTED_BUNDLE_ID"
          echo "Request:    $REQUEST_ID"
          echo "Container:  $XCODE_CONTAINER_TYPE $XCODE_CONTAINER"
          echo "Bee cache:  $BEE_CACHE_DIRECTORY"
          echo ""

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN_PATH"
          echo ""

          if [[ "$XCODE_CONTAINER_TYPE" == "workspace" ]]; then
            container_args=(-workspace "$XCODE_CONTAINER")
          else
            container_args=(-project "$XCODE_CONTAINER")
          fi

          set +e
          xcodebuild \
            "${container_args[@]}" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -resultBundlePath "$result_bundle" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive \
            2>&1 | tee "$archive_log"
          status=${PIPESTATUS[0]}
          set -e

          ended_at="$(date +%s)"
          duration="$((ended_at - started_at))"

          echo "ARCHIVE_SECONDS=$duration" >> "$GITHUB_ENV"

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Xcode archive failed after ${duration}s with exit code $status."
            exit "$status"
          fi

          if [[ ! -d "$archive_path" ]]; then
            echo "::error::Xcode reported success but no archive was created."
            exit 1
          fi

          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"
          echo "[OK] Archive created in ${duration}s."
          du -sh "$archive_path"

      - name: Analyze Unity Bee cache effectiveness
        id: bee-analysis
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          archive_log="$GITHUB_WORKSPACE/logs/archive.log"
          dag_reused=true
          future_warnings=0
          graph_line=""
          to_build=""
          to_use=""

          if grep -Fq "bee.dag couldn't be loaded" "$archive_log"; then
            dag_reused=false
          fi

          future_warnings="$(
            grep -Eci \
              'timestamp is in the future|Cannot trust contents.*future' \
              "$archive_log" || true
          )"

          graph_line="$(
            grep -F "Finished compiling graph:" "$archive_log" |
              tail -1 || true
          )"

          if [[ -n "$graph_line" ]]; then
            to_build="$(
              sed -nE 's/.*\(([0-9]+) ToBuild, ([0-9]+) ToUse\).*/\1/p' <<< "$graph_line"
            )"
            to_use="$(
              sed -nE 's/.*\(([0-9]+) ToBuild, ([0-9]+) ToUse\).*/\2/p' <<< "$graph_line"
            )"
          fi

          {
            echo "BEE_DAG_REUSED=$dag_reused"
            echo "BEE_FUTURE_WARNINGS=$future_warnings"
            echo "BEE_TO_BUILD=${to_build:-unknown}"
            echo "BEE_TO_USE=${to_use:-unknown}"
            echo "BEE_GRAPH_LINE<<EOF"
            echo "$graph_line"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "Bee DAG reused: $dag_reused"
          echo "Bee future-timestamp warnings: $future_warnings"
          echo "Bee graph: ${graph_line:-not reported}"

      - name: Inspect Unity Bee cache after archive
        id: bee-cache-size
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          max_cache_bytes=$((4 * 1024 * 1024 * 1024))
          size_bytes=0
          save_allowed=false

          if [[ -d "$BEE_CACHE_DIRECTORY" ]]; then
            size_kib="$(du -sk "$BEE_CACHE_DIRECTORY" | awk '{print $1}')"
            size_bytes="$((size_kib * 1024))"
            du -sh "$BEE_CACHE_DIRECTORY"

            if [[ "$size_bytes" -gt 0 && "$size_bytes" -le "$max_cache_bytes" ]]; then
              save_allowed=true
            elif [[ "$size_bytes" -gt "$max_cache_bytes" ]]; then
              echo "::warning::Unity Bee cache is larger than 4 GiB and will not be uploaded."
            fi
          else
            echo "::warning::Unity Bee cache directory was not produced."
          fi

          {
            echo "size_bytes=$size_bytes"
            echo "save_allowed=$save_allowed"
          } >> "$GITHUB_OUTPUT"

          {
            echo "BEE_CACHE_BYTES_AFTER=$size_bytes"
            echo "BEE_CACHE_SAVE_ALLOWED=$save_allowed"
          } >> "$GITHUB_ENV"

          echo "Unity Bee cache upload allowed: $save_allowed"

      - name: Save Unity Bee object cache
        if: ${{ success() && inputs.use_build_cache && steps.bee-cache-restore.outcome != 'failure' && steps.bee-cache-size.outputs.save_allowed == 'true' && steps.bee-cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/Library/Unity/cache/bee
          key: ${{ steps.bee-cache-restore.outputs.cache-primary-key }}

      - name: Read archive metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          app_info="$(
            find "$ARCHIVE_PATH/Products/Applications" \
              -maxdepth 2 \
              -name Info.plist \
              -print \
              -quit
          )"

          if [[ -z "$app_info" ]]; then
            echo "::error::Could not locate the archived application's Info.plist."
            exit 1
          fi

          archive_bundle_id="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              "$app_info"
          )"

          archive_version="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              "$app_info"
          )"

          archive_build="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleVersion' \
              "$app_info"
          )"

          if [[ "$archive_bundle_id" != "$EXPECTED_BUNDLE_ID" ]]; then
            echo "::error::Archived bundle ID is $archive_bundle_id; expected $EXPECTED_BUNDLE_ID."
            exit 1
          fi

          {
            echo "ARCHIVE_VERSION=$archive_version"
            echo "ARCHIVE_BUILD=$archive_build"
          } >> "$GITHUB_ENV"

          echo "Archive bundle:  $archive_bundle_id"
          echo "Archive version: $archive_version"
          echo "Archive build:   $archive_build"

      - name: Create App Store export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          export_options="$GITHUB_WORKSPACE/export/ExportOptions.plist"

          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "$export_options"
          echo "EXPORT_OPTIONS_PATH=$export_options" >> "$GITHUB_ENV"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          export_dir="$GITHUB_WORKSPACE/export/ipa"
          export_log="$GITHUB_WORKSPACE/logs/export.log"
          started_at="$(date +%s)"

          rm -rf "$export_dir"
          mkdir -p "$export_dir"

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$export_log"
          status=${PIPESTATUS[0]}
          set -e

          ended_at="$(date +%s)"
          duration="$((ended_at - started_at))"

          echo "EXPORT_SECONDS=$duration" >> "$GITHUB_ENV"

          if [[ "$status" -ne 0 ]]; then
            echo "::error::IPA export failed after ${duration}s with exit code $status."
            exit "$status"
          fi

          ipa_path="$(find "$export_dir" -maxdepth 1 -type f -name '*.ipa' -print -quit)"

          if [[ -z "$ipa_path" || ! -s "$ipa_path" ]]; then
            echo "::error::xcodebuild export succeeded, but no IPA was produced."
            exit 1
          fi

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          echo "[OK] IPA exported in ${duration}s."
          ls -lh "$ipa_path"

      - name: Upload IPA to App Store Connect
        if: ${{ inputs.upload_to_app_store }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          upload_log="$GITHUB_WORKSPACE/logs/upload.log"
          started_at="$(date +%s)"

          set +e
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$upload_log"
          status=${PIPESTATUS[0]}
          set -e

          ended_at="$(date +%s)"
          duration="$((ended_at - started_at))"

          echo "UPLOAD_SECONDS=$duration" >> "$GITHUB_ENV"

          if [[ "$status" -ne 0 ]]; then
            echo "::error::App Store Connect upload failed after ${duration}s."
            exit "$status"
          fi

          echo "[OK] IPA uploaded to App Store Connect in ${duration}s."

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ inputs.app }}-${{ inputs.request_id }}
          path: |
            logs/**
            export/DistributionSummary.plist
            export/Packaging.log
            ios-project/tidvis-build.json
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6

      - name: Upload optional successful IPA
        if: ${{ success() && inputs.keep_ipa_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ipa-${{ inputs.app }}-${{ inputs.request_id }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Write build summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PODS_V4_EXACT_HIT: ${{ steps.pods-v4-restore.outputs.cache-hit }}
          PODS_V4_MATCHED_KEY: ${{ steps.pods-v4-restore.outputs.cache-matched-key }}
          PODS_V3_MATCHED_KEY: ${{ steps.pods-v3-restore.outputs.cache-matched-key }}
          BEE_EXACT_HIT: ${{ steps.bee-cache-restore.outputs.cache-hit }}
          BEE_MATCHED_KEY: ${{ steps.bee-cache-restore.outputs.cache-matched-key }}
        shell: bash
        run: |
          set +e

          total_seconds="unknown"
          if [[ "${BUILDER_STARTED_EPOCH:-}" =~ ^[0-9]+$ ]]; then
            total_seconds="$(( $(date +%s) - BUILDER_STARTED_EPOCH ))"
          fi

          {
            echo "# iOS App Store Build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | **${JOB_STATUS}** |"
            echo "| Builder core | \`${BUILDER_CORE_VERSION}\` |"
            echo "| Caller repository | \`${GITHUB_REPOSITORY}\` |"
            echo "| App | ${APP_DISPLAY_NAME} |"
            echo "| App key | \`${APP_KEY}\` |"
            echo "| Bundle ID | \`${EXPECTED_BUNDLE_ID}\` |"
            echo "| Unity | \`${UNITY_VERSION}\` |"
            echo "| Xcode | \`${XCODE_VERSION}\` |"
            echo "| Request | \`${REQUEST_ID}\` |"
            echo "| Input | \`${INPUT_ASSET_NAME}\` |"
            echo "| Upload requested | ${UPLOAD_TO_APP_STORE} |"
            echo "| Total workflow duration | ${total_seconds}s |"
            echo "| Credential validation | ${CREDENTIAL_SECONDS:-unknown}s |"
            echo "| Package download | ${PACKAGE_DOWNLOAD_SECONDS:-unknown}s |"
            echo "| CocoaPods exact v4 hit | ${PODS_V4_EXACT_HIT:-false} |"
            echo "| CocoaPods v4 matched key | \`${PODS_V4_MATCHED_KEY:-none}\` |"
            echo "| CocoaPods legacy matched key | \`${PODS_V3_MATCHED_KEY:-none}\` |"
            echo "| CocoaPods lock restored | ${PODS_LOCK_RESTORED:-false} |"
            echo "| CocoaPods integration duration | ${PODS_INSTALL_SECONDS:-0}s |"
            echo "| Bee exact hit | ${BEE_EXACT_HIT:-false} |"
            echo "| Bee matched key | \`${BEE_MATCHED_KEY:-none}\` |"
            echo "| Bee cache before | ${BEE_CACHE_BYTES_BEFORE:-unknown} bytes |"
            echo "| Bee cache after | ${BEE_CACHE_BYTES_AFTER:-unknown} bytes |"
            echo "| Bee DAG reused | ${BEE_DAG_REUSED:-unknown} |"
            echo "| Bee ToBuild | ${BEE_TO_BUILD:-unknown} |"
            echo "| Bee ToUse | ${BEE_TO_USE:-unknown} |"
            echo "| Bee future-timestamp warnings | ${BEE_FUTURE_WARNINGS:-unknown} |"
            echo "| Archive duration | ${ARCHIVE_SECONDS:-unknown}s |"
            echo "| Export duration | ${EXPORT_SECONDS:-unknown}s |"
            echo "| Upload duration | ${UPLOAD_SECONDS:-not-run}s |"
            echo "| Corrected future timestamps | ${FUTURE_TIMESTAMP_COUNT:-unknown} |"

            if [[ -n "${ARCHIVE_VERSION:-}" ]]; then
              echo "| Version | ${ARCHIVE_VERSION} |"
            fi

            if [[ -n "${ARCHIVE_BUILD:-}" ]]; then
              echo "| Build | ${ARCHIVE_BUILD} |"
            fi

            echo ""

            if [[ "$JOB_STATUS" == "success" && "$UPLOAD_TO_APP_STORE" == "true" ]]; then
              echo "## Uploaded to App Store Connect"
              echo "Apple will now process the build for TestFlight."
            elif [[ "$JOB_STATUS" == "success" ]]; then
              echo "## Archive and IPA export succeeded"
              echo "App Store upload was intentionally skipped."
            else
              echo "## Build failed"
              echo "Open the failed step or download the three-day diagnostics artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary signing material
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "$SIGNING_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi

          rm -f "$RUNNER_TEMP/ios-development.p12"
          rm -rf "$RUNNER_TEMP/appstore-key"
          rm -rf "$HOME/.appstoreconnect/private_keys"

          echo "[OK] Temporary signing material cleaned."

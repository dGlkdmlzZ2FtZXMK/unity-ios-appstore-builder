name: Build iOS → App Store Connect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26

    steps:

      # ============================================================
      # 1. Select Xcode
      # ============================================================

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "Using Xcode:"
          xcodebuild -version

          echo "Using iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version


      # ============================================================
      # 2. Download the Unity-generated iOS/Xcode project
      #
      # Expected GitHub Release:
      #
      #   Tag:
      #       ios-input
      #
      #   Asset:
      #       Fortellervegg-iOS.zip
      #
      # The ZIP should contain Unity-iPhone.xcodeproj directly
      # at its root.
      # ============================================================

      - name: Download Unity iOS export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/input"

          gh release download ios-input \
            --repo "${{ github.repository }}" \
            --pattern "Fortellervegg-iOS.zip" \
            --dir "$RUNNER_TEMP/input"

          echo "Downloaded files:"
          ls -lah "$RUNNER_TEMP/input"


      # ============================================================
      # 3. Extract the Unity iOS project
      # ============================================================

      - name: Extract Unity iOS export
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ios-project"

          ditto -x -k \
            "$RUNNER_TEMP/input/Fortellervegg-iOS.zip" \
            "$GITHUB_WORKSPACE/ios-project"

          echo "Extracted contents:"
          ls -lah "$GITHUB_WORKSPACE/ios-project"

          if [ ! -d "$GITHUB_WORKSPACE/ios-project/Unity-iPhone.xcodeproj" ]; then
            echo ""
            echo "ERROR: Unity-iPhone.xcodeproj was not found."
            echo ""
            echo "The ZIP must contain the contents of the Unity iOS"
            echo "build folder directly, rather than another wrapper folder."
            echo ""
            echo "Extracted tree:"
            find "$GITHUB_WORKSPACE/ios-project" -maxdepth 3 -print
            exit 1
          fi


      # ============================================================
      # 4. Install App Store Connect API key
      #
      # Required GitHub Secrets:
      #
      #   APPLE_TEAM_ID
      #   ASC_KEY_ID
      #   ASC_ISSUER_ID
      #   ASC_PRIVATE_KEY_BASE64
      #
      # The key is installed in:
      #
      #   RUNNER_TEMP
      #       Used explicitly by xcodebuild
      #
      #   ~/.appstoreconnect/private_keys/
      #       Used automatically by altool
      # ============================================================

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          TEMP_KEY_DIR="$RUNNER_TEMP/appstore-key"
          TEMP_KEY_PATH="$TEMP_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          mkdir -p "$TEMP_KEY_DIR"

          echo "$ASC_PRIVATE_KEY_BASE64" \
            | base64 -D \
            > "$TEMP_KEY_PATH"

          chmod 600 "$TEMP_KEY_PATH"

          echo "ASC_KEY_PATH=$TEMP_KEY_PATH" >> "$GITHUB_ENV"

          ALTOOL_KEY_DIR="$HOME/.appstoreconnect/private_keys"

          mkdir -p "$ALTOOL_KEY_DIR"

          cp "$TEMP_KEY_PATH" \
            "$ALTOOL_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          chmod 600 \
            "$ALTOOL_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          echo "App Store Connect API key installed."


      # ============================================================
      # 5. CocoaPods
      #
      # Some Unity plugins may generate a Podfile.
      # If there is no Podfile, nothing happens here.
      # ============================================================

      - name: Install CocoaPods dependencies
        working-directory: ios-project
        run: |
          if [ -f "Podfile" ]; then

            echo "Podfile found."

            if [ -f "Podfile.lock" ]; then
              echo "Podfile.lock found."
              pod install --deployment
            else
              echo "No Podfile.lock found."
              pod install
            fi

          else
            echo "No Podfile found - skipping CocoaPods."
          fi


      # ============================================================
      # 6. Determine whether to build .xcworkspace or .xcodeproj
      #
      # If CocoaPods created a workspace, use that.
      # Otherwise use Unity-iPhone.xcodeproj.
      # ============================================================

      - name: Determine Xcode build container
        working-directory: ios-project
        run: |
          if [ -d "Unity-iPhone.xcworkspace" ]; then

            echo "Using Unity-iPhone.xcworkspace"

            echo "XCODE_CONTAINER_TYPE=workspace" >> "$GITHUB_ENV"
            echo "XCODE_CONTAINER=Unity-iPhone.xcworkspace" >> "$GITHUB_ENV"

          else

            echo "Using Unity-iPhone.xcodeproj"

            echo "XCODE_CONTAINER_TYPE=project" >> "$GITHUB_ENV"
            echo "XCODE_CONTAINER=Unity-iPhone.xcodeproj" >> "$GITHUB_ENV"

          fi


      # ============================================================
      # 7. Show available Xcode schemes
      #
      # Mainly diagnostic. If the build configuration changes later,
      # this makes failures much easier to understand.
      # ============================================================

      - name: Show Xcode schemes
        working-directory: ios-project
        run: |
          if [ "$XCODE_CONTAINER_TYPE" = "workspace" ]; then

            xcodebuild \
              -workspace "$XCODE_CONTAINER" \
              -list

          else

            xcodebuild \
              -project "$XCODE_CONTAINER" \
              -list

          fi


      # ============================================================
      # 8. Archive Fortellervegg
      #
      # Uses automatic Apple signing.
      #
      # The App Store Connect API key allows Xcode to communicate
      # with Apple's provisioning/signing services.
      # ============================================================

      - name: Archive Fortellervegg
        working-directory: ios-project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/Fortellervegg.xcarchive"

          if [ "$XCODE_CONTAINER_TYPE" = "workspace" ]; then

            xcodebuild \
              -workspace "$XCODE_CONTAINER" \
              -scheme "Unity-iPhone" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              clean archive

          else

            xcodebuild \
              -project "$XCODE_CONTAINER" \
              -scheme "Unity-iPhone" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              clean archive

          fi

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Xcode archive was not created."
            exit 1
          fi

          echo ""
          echo "Archive created:"
          du -sh "$ARCHIVE_PATH"


      # ============================================================
      # 9. Create App Store export configuration
      # ============================================================

      - name: Create ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store-connect</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingStyle</key>
              <string>automatic</string>

              <key>uploadSymbols</key>
              <true/>

              <key>stripSwiftSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist:"
          cat "$RUNNER_TEMP/ExportOptions.plist"


      # ============================================================
      # 10. Export signed IPA
      # ============================================================

      - name: Export Fortellervegg IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          EXPORT_PATH="$GITHUB_WORKSPACE/export"

          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Fortellervegg.xcarchive" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo ""
          echo "Exported files:"
          find "$EXPORT_PATH" -maxdepth 2 -type f -print

          IPA_PATH=$(find "$EXPORT_PATH" \
            -maxdepth 1 \
            -type f \
            -name "*.ipa" \
            -print \
            -quit)

          if [ -z "$IPA_PATH" ]; then
            echo ""
            echo "ERROR: No IPA was produced."
            exit 1
          fi

          echo ""
          echo "IPA produced successfully:"
          echo "$IPA_PATH"

          echo ""
          echo "IPA size:"
          du -h "$IPA_PATH"

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # 11. Upload directly to App Store Connect
      #
      # This replaces Transporter.
      #
      # Apple processes the uploaded build after this completes.
      # Once processing completes, it should appear in TestFlight.
      # ============================================================

      - name: Upload Fortellervegg to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "Uploading IPA to App Store Connect:"
          echo "$IPA_PATH"
          echo ""

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo ""
          echo "=========================================="
          echo "Fortellervegg upload completed successfully."
          echo "=========================================="


      # ============================================================
      # 12. Save IPA as a GitHub Actions artifact
      #
      # Current Node 24-compatible action.
      #
      # 'always()' means we also try to preserve the IPA if Apple's
      # upload rejects it, which is useful for troubleshooting.
      # ============================================================

      - name: Save Fortellervegg IPA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Fortellervegg-AppStore
          path: |
            export/*.ipa
            export/DistributionSummary.plist
            export/Packaging.log
          if-no-files-found: warn
          retention-days: 14
